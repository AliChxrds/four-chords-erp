name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    # Disposable PostgreSQL for the API and migration suites. Trust auth is
    # acceptable only because this container lives for one job and holds no data.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: erp_test_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U erp_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_TEST_PORT: "55439"
      MIGRATION_TEST_ADMIN: erp_test_admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Unit, app and API tests
        run: npm test

      - name: Migration integration checks
        run: npm run test:migrations
